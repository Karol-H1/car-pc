# Use the dashcam webcam's built-in mic for calls whenever it's plugged in, instead of the USB audio
# adapter's mic jack (which picked up loud hum with every mic tried). Higher priority wins. The
# adapter stays above 1009 (a "monitor" of the speakers), so it remains the backup when the webcam is out.
# Installed to ~/.config/wireplumber/wireplumber.conf.d/ by system/install_mic.sh.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.usb-*UGREEN*" } ]
    actions = { update-props = { priority.session = 3000, priority.driver = 3000 } }
  }
  {
    matches = [ { node.name = "~alsa_input.usb-GeneralPlus*" } ]
    actions = { update-props = { priority.session = 1500, priority.driver = 1500 } }
  }
]
